# Reliability spike stack (D-5). Not a deployment example.
#   STORAGE=Redis|Postgres  docker compose -f spike/compose.yml up -d --build
x-sched: &sched
  build: ..
  image: async-scheduler:spike
  environment: &env
    Scheduler__Storage: ${STORAGE:-Redis}
    Scheduler__RedisConnectionString: redis:6379,abortConnect=false
    Scheduler__PostgresConnectionString: Host=postgres;Username=postgres;Password=spike;Database=scheduler
    Scheduler__WorkerCount: "5"
    Scheduler__ServerTimeoutSeconds: "30"
    Scheduler__PollIntervalSeconds: "1"
  depends_on: [redis, postgres, receiver]
  restart: "no"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: spike, POSTGRES_DB: scheduler }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  receiver:
    image: python:3.13-alpine
    command: ["python", "/receiver.py"]
    volumes: ["./receiver.py:/receiver.py:ro"]
    environment: { SLOW_SECONDS: "25" }
    ports: ["9000:8080"]
  s1:
    <<: *sched
    ports: ["8081:8080"]
  s2:
    <<: *sched
    ports: ["8082:8080"]
  s3:
    <<: *sched
    ports: ["8083:8080"]

volumes:
  redisdata:
  pgdata:
